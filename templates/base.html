<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{% block title %}SmartSpace{% endblock %}</title>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">

    <style>
        body {
            margin: 0;
            background: #05070d;
            color: #e6fef5;
            font-family: Consolas, monospace;
        }

        /* BACKGROUND EFFECT */
        body::before {
            content: "";
            position: fixed;
            inset: 0;
            background:
                radial-gradient(circle at top left, rgba(0,255,159,0.08), transparent 30%),
                radial-gradient(circle at bottom right, rgba(0,191,255,0.06), transparent 30%);
            pointer-events: none;
        }

        .app-layout {
            display: flex;
            min-height: 100vh;
        }

        /* SIDEBAR */
        .sidebar {
            width: 240px;
            background: #030a14;
            border-right: 1px solid rgba(0,255,159,0.15);
            padding: 25px 15px;
        }

        .sidebar-title {
            font-size: 22px;
            font-weight: bold;
            margin-bottom: 5px;
        }

        .sidebar-subtitle {
            font-size: 12px;
            color: #7f95a3;
            margin-bottom: 20px;
        }

        .sidebar a {
            display: block;
            padding: 12px 16px;
            margin-bottom: 8px;
            text-decoration: none;
            color: #c3d4dc;
            border-radius: 8px;
            border-left: 3px solid transparent;
            transition: 0.25s;
        }

        .sidebar a:hover {
            background: rgba(0,255,159,0.08);
            color: #00ff9f;
            border-left: 3px solid #00ff9f;
        }

        .sidebar a.active {
            background: rgba(0,255,159,0.12);
            color: #00ff9f;
            border-left: 3px solid #00ff9f;
            font-weight: bold;
        }

        .sidebar .logout-link {
            color: #ff6b7d;
        }

        .sidebar hr {
            border-color: rgba(255,255,255,0.1);
        }

        /* CONTENT */
        .page-content {
            flex: 1;
            padding: 25px;
        }

        /* CARD */
        .dashboard-card {
            background: #0a0f18;
            border: 1px solid rgba(0,255,159,0.15);
            border-radius: 14px;
            overflow: hidden;
            max-width: 1000px;
            margin: auto;
            box-shadow: 0 0 20px rgba(0,255,159,0.08);
        }

        .dashboard-header {
            background: linear-gradient(90deg, rgba(0,255,159,0.15), rgba(0,191,255,0.1));
            text-align: center;
            padding: 20px;
            border-bottom: 1px solid rgba(0,255,159,0.15);
        }

        .dashboard-header h4 {
            margin: 0;
            font-size: 28px;
        }

        .dashboard-header small {
            color: #00ff9f;
        }

        .card-body-custom {
            padding: 25px;
        }

        /* BUTTONS */
        .btn-cyber {
            width: 100%;
            padding: 12px;
            border: 1px solid #00ff9f;
            background: transparent;
            color: #00ff9f;
            border-radius: 8px;
            font-weight: bold;
        }

        .btn-cyber:hover {
            background: #00ff9f;
            color: black;
            box-shadow: 0 0 12px rgba(0,255,159,0.3);
        }

        .btn-cyber-secondary {
            border: 1px solid #59d0ff;
            color: #59d0ff;
            padding: 10px 18px;
            border-radius: 8px;
            text-decoration: none;
        }

        .btn-cyber-secondary:hover {
            background: #59d0ff;
            color: black;
        }

        .btn-cyber-danger {
            border: 1px solid #ff6b7d;
            color: #ff6b7d;
            padding: 10px 18px;
            border-radius: 8px;
            text-decoration: none;
        }

        .btn-cyber-danger:hover {
            background: #ff6b7d;
            color: black;
        }

        /* INPUT */
        .form-control {
            background: #0a0f18;
            border: 1px solid #1f2a36;
            color: white;
        }

        .form-control:focus {
            border-color: #00ff9f;
            box-shadow: 0 0 10px rgba(0,255,159,0.25);
        }

    </style>

    {% block extra_css %}{% endblock %}
</head>

<body>
<div class="app-layout">

    <!-- SIDEBAR -->
    <nav class="sidebar">
        <div class="sidebar-title">SmartSpace</div>
        <div class="sidebar-subtitle">[ CYBERSECURITY PANEL ]</div>

        <a href="{{ url_for('index') }}" class="{% if request.endpoint == 'index' %}active{% endif %}">Home</a>
        <a href="{{ url_for('history') }}" class="{% if request.endpoint == 'history' %}active{% endif %}">Detection History</a>
        <a href="{{ url_for('statistics') }}" class="{% if request.endpoint == 'statistics' %}active{% endif %}">Statistics</a>
        <a href="{{ url_for('export_page') }}" class="{% if request.endpoint == 'export_page' %}active{% endif %}">Export Data</a>
        <a href="{{ url_for('link_checker') }}" class="{% if request.endpoint == 'link_checker' %}active{% endif %}">Link Checker</a>
        <a href="{{ url_for('link_history') }}" class="{% if request.endpoint == 'link_history' %}active{% endif %}">Link History</a>

        <hr>

        {% include "_auth_links.html" %}
    </nav>

    <!-- CONTENT -->
    <main class="page-content">
        {% block content %}{% endblock %}
    </main>

</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>

{% block extra_js %}{% endblock %}
</body>
</html>
