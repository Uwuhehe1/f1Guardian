<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <title>Admin • Add User</title>
  <meta name="viewport" content="width=device-width, initial-scale=1">

  <style>
    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      background: #05070d;
      color: #e6fef5;
      font-family: Consolas, monospace;
      min-height: 100vh;
    }

    body::before {
      content: "";
      position: fixed;
      inset: 0;
      background:
        radial-gradient(circle at top left, rgba(0,255,159,0.08), transparent 30%),
        radial-gradient(circle at bottom right, rgba(0,191,255,0.06), transparent 30%);
      pointer-events: none;
      z-index: 0;
    }

    .page {
      position: relative;
      z-index: 1;
      max-width: 1000px;
      margin: 30px auto;
      padding: 0 20px 30px;
    }

    .topbar {
      display: flex;
      gap: 10px;
      flex-wrap: wrap;
      margin-bottom: 20px;
    }

    .btn {
      display: inline-block;
      padding: 11px 16px;
      border-radius: 10px;
      text-decoration: none;
      font-weight: 700;
      transition: .25s ease;
      border: 1px solid transparent;
      cursor: pointer;
      font-family: inherit;
      font-size: 14px;
      background: transparent;
    }

    .btn-primary {
      color: #00ff9f;
      border-color: #00ff9f;
    }

    .btn-primary:hover {
      background: #00ff9f;
      color: #000;
      box-shadow: 0 0 12px rgba(0,255,159,0.25);
    }

    .btn-secondary {
      color: #59d0ff;
      border-color: #59d0ff;
    }

    .btn-secondary:hover {
      background: #59d0ff;
      color: #000;
    }

    .btn-danger {
      color: #ff6b7d;
      border-color: #ff6b7d;
    }

    .btn-danger:hover {
      background: #ff6b7d;
      color: #000;
    }

    .btn-success {
      color: #00ff9f;
      border-color: #00ff9f;
    }

    .btn-success:hover {
      background: #00ff9f;
      color: #000;
    }

    .card {
      background: #0a0f18;
      border: 1px solid rgba(0,255,159,0.15);
      border-radius: 16px;
      overflow: hidden;
      box-shadow: 0 0 24px rgba(0,255,159,0.08);
    }

    .card-header {
      background: linear-gradient(90deg, rgba(0,255,159,0.16), rgba(0,191,255,0.10));
      padding: 24px 20px 18px;
      border-bottom: 1px solid rgba(0,255,159,0.15);
      text-align: center;
    }

    .card-header h1 {
      margin: 0;
      font-size: 30px;
      color: #ffffff;
    }

    .card-header p {
      margin: 8px 0 0;
      color: #00ff9f;
      font-size: 14px;
    }

    .card-body {
      padding: 24px;
    }

    .alert-danger {
      background: rgba(255, 107, 125, 0.10);
      color: #ff6b7d;
      border: 1px solid rgba(255, 107, 125, 0.28);
      border-radius: 10px;
      padding: 12px 14px;
      margin-bottom: 18px;
    }

    .form-grid {
      display: grid;
      grid-template-columns: repeat(2, 1fr);
      gap: 18px;
    }

    .full {
      grid-column: 1 / -1;
    }

    .field label {
      display: block;
      margin-bottom: 8px;
      color: #00ff9f;
      font-weight: 700;
      font-size: 14px;
      letter-spacing: .4px;
    }

    .field input,
    .field select {
      width: 100%;
      background: #07111f;
      border: 1px solid #1a2a3d;
      color: #e6fef5;
      padding: 12px 14px;
      border-radius: 10px;
      font-family: inherit;
      font-size: 14px;
      outline: none;
      transition: 0.25s ease;
    }

    .field input:focus,
    .field select:focus {
      border-color: #00ff9f;
      box-shadow: 0 0 10px rgba(0,255,159,0.18);
    }

    .field small {
      display: block;
      margin-top: 6px;
      color: #8ea5b3;
      font-size: 12px;
    }

    .actions {
      display: flex;
      gap: 12px;
      flex-wrap: wrap;
      margin-top: 24px;
    }

    @media (max-width: 768px) {
      .form-grid {
        grid-template-columns: 1fr;
      }

      .actions {
        flex-direction: column;
      }

      .actions .btn,
      .topbar .btn {
        text-align: center;
        width: 100%;
      }
    }
  </style>
</head>
<body>

<div class="page">

  <div class="topbar">
    <a class="btn btn-secondary" href="{{ url_for('admin_home') }}">← Dashboard</a>
    <a class="btn btn-primary" href="{{ url_for('admin_users') }}">👥 Users</a>
    <a class="btn btn-danger" href="{{ url_for('admin_logout') }}">Admin Logout</a>
  </div>

  <div class="card">
    <div class="card-header">
      <h1>Add User</h1>
      <p>Create a new user account for the system</p>
    </div>

    <div class="card-body">
      {% if error %}
        <div class="alert-danger">{{ error }}</div>
      {% endif %}

      <form method="post">
        <div class="form-grid">
          <div class="field">
            <label for="name">Full Name</label>
            <input id="name" name="name" value="{{ name or '' }}" required>
          </div>

          <div class="field">
            <label for="username">Username</label>
            <input
              id="username"
              name="username"
              value="{{ username or '' }}"
              minlength="3"
              maxlength="24"
              pattern="[a-z0-9_]{3,24}"
              required>
            <small>3–24 chars, lowercase letters, numbers, underscore.</small>
          </div>

          <div class="field">
            <label for="email">Email</label>
            <input
              id="email"
              type="email"
              name="email"
              value="{{ email or '' }}"
              required>
          </div>

          <div class="field">
            <label for="password">Password</label>
            <input
              id="password"
              type="password"
              name="password"
              minlength="8"
              required>
            <small>Minimum 8 characters.</small>
          </div>

          <div class="field full" style="max-width: 260px;">
            <label for="role">Role</label>
            <select id="role" name="role">
              <option value="user" {% if role != 'admin' %}selected{% endif %}>user</option>
              <option value="admin" {% if role == 'admin' %}selected{% endif %}>admin</option>
            </select>
          </div>
        </div>

        <div class="actions">
          <button class="btn btn-success" type="submit">Create User</button>
          <a class="btn btn-secondary" href="{{ url_for('admin_users') }}">Cancel</a>
        </div>
      </form>
    </div>
  </div>

</div>

</body>
</html>
